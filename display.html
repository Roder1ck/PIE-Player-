<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ad Display</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #display-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .ad-content {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Fade speed */
        }

        .show { opacity: 1; }
    </style>
</head>
<body>

<div id="display-container">
    <!-- Content injected here -->
</div>

<script>
    const container = document.getElementById('display-container');
    let ads = [];
    let currentIndex = 0;
    let timer;

    function loadAds() {
        const data = localStorage.getItem('ad_playlist');
        ads = data ? JSON.parse(data) : [];
        if (ads.length > 0) {
            currentIndex = 0;
            playNext();
        } else {
            container.innerHTML = "<h2 style='color:white'>No Ads Programmed</h2>";
        }
    }

    function playNext() {
        clearTimeout(timer);
        if (ads.length === 0) return;

        const ad = ads[currentIndex];
        container.innerHTML = ''; // Clear current

        let element;
        if (ad.type === 'video') {
            element = document.createElement('video');
            element.src = ad.url;
            element.autoplay = true;
            element.muted = true; // Required for most browsers to autoplay
            element.className = 'ad-content';
            element.onended = () => {
                goToNext();
            };
        } else {
            element = document.createElement('img');
            element.src = ad.url;
            element.className = 'ad-content';
            timer = setTimeout(goToNext, ad.duration);
        }

        container.appendChild(element);
        
        // Trigger fade in
        setTimeout(() => element.classList.add('show'), 50); 
    }

    function goToNext() {
        const currentElement = container.querySelector('.ad-content');
        if (currentElement) {
            currentElement.classList.remove('show'); // Fade out
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % ads.length;
                playNext();
            }, 1500); // Wait for fade out animation
        } else {
            currentIndex = (currentIndex + 1) % ads.length;
            playNext();
        }
    }

    // Listen for updates from the management page
    window.addEventListener('storage', (e) => {
        if (e.key === 'ad_playlist') {
            loadAds();
        }
    });

    loadAds();
</script>
</body>
</html>
